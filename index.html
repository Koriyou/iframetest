<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>TouchPoints UAT preference center</title>
<style>:root{font-family:system-ui,sans-serif;color-scheme:light}body{margin:0;min-height:100vh;background:#eef0f0;color:#273138}header{padding:16px 20px;background:#24323a;color:#fff;font-size:14px}main{width:min(1200px,100%);margin:0 auto}iframe{display:block;width:100%;min-height:900px;border:0;background:#fff}.error{margin:24px;padding:16px;border:1px solid #b42318;background:#fff;color:#b42318}.fallback{display:block;margin:12px 24px 24px;color:#922a65}</style>
</head>
<body><header>UAT demonstration - TouchPoints email preferences</header><main id="app"></main>
<script>(()=>{const p=new URLSearchParams(location.search),v=p.get('v'),org=p.get('org')||'Dubai Police',m=p.get('m'),t=p.get('t'),a=document.getElementById('app');if(!['categories','all'].includes(v)||!/^[0-9]{10,15}$/.test(m||'')||!t){a.innerHTML='<div class="error"><strong>Missing UAT link parameters.</strong><br>Use the approved demonstration URL supplied by the delivery team.</div>';return}document.querySelector('header').textContent='UAT demonstration - '+org+' email preferences';const u=new URL('https://meedaf--uat.sandbox.my.site.com/lpvforcesite/PreferenceCenter');u.search=new URLSearchParams({v:v,m:m,t:t});const f=document.createElement('iframe');f.title='TouchPoints email preferences';f.src=u;f.referrerPolicy='no-referrer';a.appendChild(f);const l=document.createElement('a');l.className='fallback';l.href=u;l.target='_blank';l.rel='noreferrer';l.textContent='Open the UAT preference center directly';a.appendChild(l)})()</script>
</body></html>
